name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic httpx openapi-spec-validator
      - name: 契约 / 语义 / HTTP 测试
        # 不装推理后端：依赖模型前向的用例自动 SKIP，契约/校验/文档层全跑（CI 不下载 644MB 权重）
        run: python tests/run_contract_tests.py
      - name: OpenAPI 可生成
        run: python -c "from laya_api.server import app; import json; d=app.openapi(); print(d['openapi'], len(d['components']['schemas']), 'schemas')"

  sdk-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 编译 Java SDK
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out $(find sdk/java/src -name '*.java')

  sdk-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 类型检查
        run: npx --yes -p typescript@5.9.2 tsc --noEmit -p sdk/ts
