name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject 声明支持 3.11 / 3.12 / 3.13 —— 三档都要真跑，别只测一个
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic httpx openapi-spec-validator
      - name: 契约 / 语义 / HTTP 测试
        # 不装推理后端：依赖模型前向的用例自动 SKIP，契约/校验/文档层全跑（CI 不下载 644MB 权重）
        run: python tests/run_contract_tests.py
      - name: OpenAPI 可生成（原生 + 3.0 档 + 扁平档）
        # 这一步必须让 laya_api 可导入（测试脚本自己插了 src，这里没有）
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from laya_api.server import app
          from laya_api.openapi30 import to_openapi_30, to_kingdee_profile

          doc = app.openapi()
          print("原生  :", doc["openapi"], len(doc["components"]["schemas"]), "schemas")
          d30 = to_openapi_30(doc)
          kd = to_kingdee_profile(doc)
          print("3.0 档:", d30["openapi"], len(d30["paths"]), "endpoints")
          print("扁平档:", kd["openapi"], len(kd["paths"]), "endpoints")
          assert kd["openapi"].startswith("3.0."), kd["openapi"]
          assert '"required": [' not in __import__("json").dumps(kd), "扁平档残留 required"
          PY

  sdk-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 编译 Java SDK
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out $(find sdk/java/src -name '*.java')

  sdk-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: 类型检查
        run: npx --yes -p typescript@5.9.2 tsc --noEmit -p sdk/ts
