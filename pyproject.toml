[project]
name = "laya-decision-api"
version = "1.0.1"
description = "Laya 本地决策模型的服务化接口：意图分类 / 工单分派 / LLM 路由 / 内容审核，离线零 token（契约 + HTTP 服务 + 客户端 + 阈值路由）"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# 注意：必须是 SPDX 字符串。旧的 `license = { text = "..." }` 表写在 setuptools ≥77 上直接构建失败
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "laya-decision-api contributors" }]
keywords = ["laya", "decision", "system-1", "fastapi", "openapi", "mlx", "torch", "llm-router",
            "intent-classification", "triage", "content-moderation", "offline-inference",
            "self-hosted", "inference-server", "structured-output"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    # License 走 SPDX 表达式（license 字段），PEP 639 起不允许再留 License 分类器
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.130",
    "uvicorn>=0.40",
    "pydantic>=2.10",
    "httpx>=0.28",
]
# 推理后端不在这里强依赖：按平台显式装（见下）。容器内不使用本文件，
# 容器依赖见 requirements-docker.txt（torch 后端 + 上游 laya）。

[project.optional-dependencies]
# macOS / Apple Silicon：Metal 加速后端
mlx = ["laya-mlx", "mlx"]
# Linux / 容器：CPU 推理（容器里由 Dockerfile 从 CPU 索引装 torch）
torch = ["laya", "torch"]
# 与 Hermes Agent 共用同一代码路径时才需要（非必需）
hermes = ["hermes-laya[mlx]"]
test = ["pytest>=8", "openapi-spec-validator"]

[project.urls]
Documentation = "https://github.com/bmw8080/laya-decision-api#readme"
Source = "https://github.com/bmw8080/laya-decision-api"
Issues = "https://github.com/bmw8080/laya-decision-api/issues"
Changelog = "https://github.com/bmw8080/laya-decision-api/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
laya_api = ["static/swagger/*"]
